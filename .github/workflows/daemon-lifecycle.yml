name: Actual cross-platform daemon lifecycle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Actual systemd lifecycle
        if: runner.os == 'Linux'
        run: sudo python3 ci/service_lifecycle.py
      - name: Actual launchd or Task Scheduler lifecycle
        if: runner.os != 'Linux'
        run: python ci/service_lifecycle.py
