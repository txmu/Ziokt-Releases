name: Installer and publication integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: sha256sum -c deploy.py.sha256
      - run: sh -n install.sh
      - run: python -m unittest discover -s tests -v
